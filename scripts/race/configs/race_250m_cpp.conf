# scripts/race/configs/race_250m_cpp.conf
#
# 250M-class C++ side of the race. Backbone matches the Python YAML
# in the same directory (d_model=1024, n_layers=16, n_heads=16,
# ffn_hidden=2816, vocab=50257, tied embeddings). MTP heads stay on
# top — they're the reason the C++ side wins inference.
#
# Total params:
#   backbone (tied):  ~257M
#   + 3 MTP heads:      +3.2M
#   = ~260M total
#
# All extras off (FP8, SubQ, structural, multi-res, gated attn,
# sliding-window, GQA) so the comparison is clean.

[model]
d_model               = 1024
n_layers              = 16
n_heads               = 16
n_kv_heads            = 16
head_dim              = 64
ffn_hidden_size       = 2816
vocab_size            = 50257
seq_len               = 1024
layer_norm_eps        = 1e-6
rope_theta            = 10000.0
activation            = swiglu
fused                 = 1
weight_tying          = 1
use_qk_norm           = 0
use_head_qk_norm      = 0
sliding_window_size   = -1

# MTP (kept on — this is what the C++ inference side leans on).
num_mtp_heads         = 3
mtp_loss_weight       = 0.1

# Everything else off for the race.
use_float8            = 0
multi_res             = 0
mup                   = 0
activation_checkpoint_mode = none
activation_checkpoint_interval = 1
attention_backend     = sdpa

[training]
optimizer             = adamw
lr                    = 3.0e-4
weight_decay          = 0.1
beta1                 = 0.9
beta2                 = 0.95
max_grad_norm         = 1.0

num_steps             = 1000
warmup_steps          = 100
scheduler             = cosine
log_interval          = 10

batch_size            = 4
grad_accum_steps      = 8
seq_len               = 1024

use_bf16              = 1
use_amp               = 0
use_grad_scaler       = 0

# Race-friendly defaults — no DDP, no async muon, no SGP.
async_muon            = 0
sgp_enabled           = 0
use_zero1             = 0

[optimization]
foreach_optimizer     = 1
gpu_data              = 1
gpu_data_max_tokens   = 0
cuda_graph            = 0
zero1                 = 0
fused                 = 1

[data]
data_path             = data/race_tokens.npy

[device]
device                = cuda

[checkpoint]
checkpoint_dir        = scripts/race/results/cpp_ckpt
checkpoint_interval   = 0
