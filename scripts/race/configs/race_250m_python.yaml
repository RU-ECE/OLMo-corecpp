# scripts/race/configs/race_250m_python.yaml
#
# 250M-class Python side of the race. Same backbone as race_250m_cpp.conf.
# No MTP — that's the C++ side's only architectural addition.
# Total params: ~257M (matches the C++ backbone exactly).
#
# Field names follow OLMo-core's YAML schema. The race script
# (05_train_python.sh) calls whatever entry point the user's
# OLMo-corecpp/ ships; this YAML is documented in the conventions
# OLMo-core's TransformerConfig + TrainerConfig already use.

model:
  d_model: 1024
  n_layers: 16
  n_heads: 16
  n_kv_heads: 16
  vocab_size: 50257
  max_sequence_length: 1024
  rope_theta: 10000.0
  weight_tying: true

  mlp_hidden_size: 2816
  activation_type: swiglu
  layer_norm_type: rms
  layer_norm_eps: 1.0e-6

  # No MTP / no extras. Matches the C++ backbone bitwise on params.
  attention_type: default
  block_type: reordered_norm
  use_qk_norm: false

training:
  device_train_microbatch_size: 4
  global_train_batch_size: 32   # grad_accum_steps=8 × microbatch=4
  max_duration:
    value: 1000
    unit: steps
  warmup:
    warmup_steps: 100
  scheduler:
    name: cosine

  optimizer:
    name: adamw
    learning_rate: 3.0e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]

  grad_clip:
    max_norm: 1.0

  precision: amp_bf16
  log_interval: 10

data:
  paths:
    - data/race_tokens.npy
  sequence_length: 1024

# Where the training loop will deposit its logs / checkpoints.
save_folder: scripts/race/results/python_ckpt
