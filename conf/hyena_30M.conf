# hyena_30M.conf - 30M-parameter Hyena SSM (order-2 implicit filter)
# Usage: ./build/olmo_train conf/hyena_30M.conf
#
# Sequence mixer: hyena - order-N composition of FFT convolutions
#   h_0 = v = W_v * x
#   h_i = (K_i * h_{i-1}) * u_i    i=1..N   (* = FFT conv)
#   K_i generated by positional MLP on sin/cos frequency features
#
# hyena_order=2: two FFT convolutions per layer (recommended start)
# hyena_filter_order=64: 64 positional embedding features (32 sin + 32 cos)

[model]
d_model	512
vocab_size	50257
n_layers	8
n_heads	8
n_kv_heads	-1
head_dim	-1
rope_theta	500000
layer_norm_eps	1e-6
init_std	0.02
use_qk_norm	0
num_mtp_heads	0
sequence_mixer	hyena
hyena_order	2
hyena_filter_order	64

[training]
steps	20000
batch_size	8
seq_len	512
lr	3e-4
warmup_steps	500
grad_accum	2
optimizer	adamw
amp	1
seed	42
profile	0
save	checkpoints/hyena_30M.pt
log_interval	50

[data]
data_path	data/tinystories_gpt2.npy

[optimization]
fused	0
mup	0
multi_res	0

[device]
device	auto
