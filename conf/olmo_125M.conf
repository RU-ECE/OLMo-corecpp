# olmo_125M.conf — 125M param model, full optimization stack

[model]
d_model	768
vocab_size	50257
n_layers	12
n_heads	12
n_kv_heads	-1
head_dim	-1
rope_theta	500000
layer_norm_eps	1e-6
init_std	0.02
use_qk_norm	1
num_mtp_heads	2
mtp_loss_weight	0.1

[training]
steps	10000
batch_size	8
seq_len	512
lr	3e-4
warmup_steps	200
grad_accum	1
optimizer	muon
amp	1
seed	42
profile	0
save	checkpoints/125M.pt

[data]
data_path	data/tinystories_gpt2.npy
bpe_vocab	data/gpt2/vocab.json

[optimization]
fused	1
mup	1
multi_res	1
gpu_data	0

[device]
device	auto
