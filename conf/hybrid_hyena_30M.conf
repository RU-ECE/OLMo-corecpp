# hybrid_hyena_30M.conf - 30M hybrid: even layers=Hyena, odd layers=Attention
# Usage: ./build/olmo_train conf/hybrid_hyena_30M.conf
#
# Best quality/speed trade-off: standard attention on odd layers handles
# content-sensitive pattern matching; Hyena on even layers provides cheap
# long-range context at O(n log n).

[model]
d_model	512
vocab_size	50257
n_layers	8
n_heads	8
n_kv_heads	-1
head_dim	-1
rope_theta	500000
layer_norm_eps	1e-6
init_std	0.02
use_qk_norm	1
num_mtp_heads	0
sequence_mixer	hybrid_hyena
hyena_order	2
hyena_filter_order	64

[training]
steps	20000
batch_size	8
seq_len	512
lr	3e-4
warmup_steps	500
grad_accum	2
optimizer	adamw
amp	1
seed	42
profile	0
save	checkpoints/hybrid_hyena_30M.pt
log_interval	50

[data]
data_path	data/tinystories_gpt2.npy

[optimization]
fused	0
mup	0
multi_res	0

[device]
device	auto
