# wave_30M.conf - 30M-parameter Wave-field transformer (content-modulated)
# Usage: ./build/olmo_train conf/wave_30M.conf
#
# Sequence mixer: wave - content-modulated damped-wave FFT convolution
#   kernel: w_h(t) = exp(-alpha_h * t) * cos(omega_h * t + phi_h)
#   gate:   g = sigmoid(W_gate * x)  (content-dependence)
#   output: y = g * FFT_conv(w, v),  then W_out * y
#
# Matches the 30M standard-attention baseline (conf/olmo.conf) for comparison.

[model]
d_model	512
vocab_size	50257
n_layers	8
n_heads	8
n_kv_heads	-1
head_dim	-1
rope_theta	500000
layer_norm_eps	1e-6
init_std	0.02
use_qk_norm	0
num_mtp_heads	0
sequence_mixer	wave

[training]
steps	20000
batch_size	8
seq_len	512
lr	3e-4
warmup_steps	500
grad_accum	2
optimizer	adamw
amp	1
seed	42
profile	0
save	checkpoints/wave_30M.pt
log_interval	50

[data]
data_path	data/tinystories_gpt2.npy

[optimization]
fused	0
mup	0
multi_res	0

[device]
device	auto
